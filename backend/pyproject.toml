[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "langchain-core>=1.2.28",
    "langgraph>=1.1.6",
    "numpy>=2.4.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.44.0",
    "yfinance>=1.2.1",
    "groq>=0.4.0",
    "supabase>=2.0.0",
    "pyjwt>=2.8.0",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.5",
    "alembic==1.19.2",
    "exchange-calendars==4.13.2",
    "google-genai==2.23.0",
    "langfuse==4.15.2",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest==9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["no-any-return", "type-arg", "no-untyped-def"]

[[tool.mypy.overrides]]
module = [
    "app.domain.*",
    "app.services.*",
    "app.providers.*",
    "app.repositories.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "app.agents.*",
    "app.api.deps",
]
ignore_errors = true
